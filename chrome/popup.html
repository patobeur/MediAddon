<!DOCTYPE html>
<html>
<head>
  <title>MediAddon</title>
  <style>
    body {
      width: 350px;
      font-family: sans-serif;
    }
    h1 {
      font-size: 16px;
      text-align: center;
      margin: 10px 0;
    }
    #media-container {
      max-height: 400px;
      overflow-y: auto;
      padding: 5px;
    }
    .media-card {
      display: flex;
      align-items: center;
      border: 1px solid #ddd;
      border-radius: 4px;
      margin-bottom: 10px;
      padding: 10px;
    }
    .media-thumbnail {
      width: 60px;
      height: 60px;
      margin-right: 10px;
      border-radius: 4px;
      object-fit: cover;
      background-color: #f0f0f0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #555;
    }
    .media-info {
      flex-grow: 1;
    }
    .media-filename {
      font-weight: bold;
      word-break: break-all;
    }
    .media-format {
      font-size: 12px;
      color: #666;
    }
    .download-link {
      margin-left: 10px;
      padding: 5px 10px;
      background-color: #007bff;
      color: white;
      text-decoration: none;
      border-radius: 4px;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <h1>Médias Détectés</h1>
  <div id="media-container"></div>
  <script src="popup.js"></script>
</body>
</html>
